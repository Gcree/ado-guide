<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ado Studio</title>
  <link rel="stylesheet" href="studio.css">
  <script>
    // 主題：記住的選擇 → 系統設定
    (function () {
      let t = null;
      try { t = localStorage.getItem("studio-theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <!-- 圖示（細線條） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/></symbol>
    <symbol id="i-loader" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.6L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.6L20 16"/><path d="M20 20v-4h-4"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5.5 6h13L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5z"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6v12"/><path d="m18 6-9 6 9 6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 6v12"/><path d="m6 6 9 6-9 6z"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M5 8h14"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M6 4v16M12 4v16M18 4v16"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 9 5-9 5-9-5z"/><path d="m3 14 9 5 9-5"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 11V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L3.5 14a1.5 1.5 0 0 1 2.5-1.6L8 15"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M9 7v10"/></symbol>
    <symbol id="i-status" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></symbol>
    <symbol id="i-steps" viewBox="0 0 24 24"><path d="M4 7h4M4 12h8M4 17h12"/><circle cx="18" cy="7" r="2"/></symbol>
    <symbol id="i-metro" viewBox="0 0 24 24"><path d="M8 21h8l-2-16h-4z"/><path d="m12 15 5-9"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-light" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="m8 3 4 3 4-3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></symbol>
    <symbol id="i-timeline" viewBox="0 0 24 24"><path d="M3 6h10M7 12h12M5 18h8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 4 7 20M17 4l-2 16M4 9h16M3 15h16"/></symbol>
    <symbol id="i-lang" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c1 4 4 7 7 8M11 5c-1 4-4 7-7 8"/><path d="m13 21 4-9 4 9M14.5 18h5"/></symbol>
  </svg>

  <div class="app">
    <!-- 側欄 -->
    <aside class="side">
      <div class="ws"><span class="ws-icon">A</span>Ado Studio <small>新歌工作站</small></div>
      <nav class="nav">
        <div class="item"><svg class="ic"><use href="#i-search"/></svg>搜尋<span class="end kbd">/</span></div>
        <div class="item"><svg class="ic"><use href="#i-inbox"/></svg>情報收件匣<span class="end pill red" style="height:18px;line-height:18px;font-size:11px">1</span></div>
      </nav>
      <label class="import-box" title="貼上 YouTube 網址，按 Enter 開始匯入">
        <svg class="ic"><use href="#i-link"/></svg>
        <input placeholder="貼上 YouTube 網址匯入新歌">
      </label>
      <div class="tree" id="songList"></div>
    </aside>

    <!-- 中間：只放編輯 —— 預覽（字幕浮在畫面下方）→ 走帶 → 時間軸／歌詞表 -->
    <main class="main">
      <div class="topbar">
        <div class="crumbs"><span>歌曲</span><i>/</i><span>處理中</span><i>/</i><b id="crumbTitle"></b></div>
        <div class="sp"></div>
        <span class="pill blue" title="歌詞、BPM、副歌高潮是真的資料；波形、段落、信心、應援、處理進度、情報是假的">設計稿</span>
        <span class="check"><span class="dot" style="background:var(--green)"></span>檢查通過</span>
        <button class="btn icon" id="btnTheme" title="切換淺色／深色"><svg class="ic"><use href="#i-sun"/></svg></button>
        <button class="btn">同步</button>
        <button class="btn primary">發布</button>
      </div>

      <section class="monitor" id="monitor">
        <div class="video" id="video">
          <div class="ph" id="phTitle"></div>
          <div class="ov-tags" id="ovTags"></div>
          <div class="ov-tc mono" id="ovTc"></div>
          <div class="caption" id="caption"><div class="jp" id="curJp"></div><div class="tr" id="curTr"></div></div>
        </div>
      </section>

      <div class="transport">
        <button class="btn icon" title="上一句（↑）"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="play" id="btnPlay" title="播放／暫停（K）"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="btn icon" title="下一句（↓）"><svg class="ic"><use href="#i-next"/></svg></button>
        <div class="tc" id="tc"></div>
        <div class="bb">第 <b id="bbBar"></b> 小節</div>
        <div class="seg"><button>0.5×</button><button>0.75×</button><button class="on">1×</button></div>
        <button class="btn" title="循環這句（R）"><svg class="ic"><use href="#i-loop"/></svg><span class="lbl">循環這句</span></button>
        <button class="btn on-toggle" id="btnCaption" title="預覽畫面上的字幕（C）"><svg class="ic"><use href="#i-text"/></svg><span class="lbl">字幕</span></button>
        <div class="sp"></div>
        <button class="btn punch" title="把目前時間打給選取的句子，並前進到下一句"><svg class="ic"><use href="#i-mark"/></svg>打點<span class="kbd lbl"> Space</span></button>
      </div>

      <div class="views">
        <button class="view on" data-view="tl"><svg class="ic"><use href="#i-timeline"/></svg>時間軸</button>
        <button class="view" data-view="table"><svg class="ic"><use href="#i-table"/></svg>歌詞表</button>
        <div class="sp"></div>
        <span id="confCount"></span>
        <button class="btn" id="btnNextRed" title="下一個要檢查的句子（G）"><span class="lbl">下一個紅色 </span><span class="kbd">G</span></button>
        <button class="btn icon" title="圖例：歌詞左邊的色條＝信心（綠高、黃中、紅要檢查）；粉紅線＝副歌高潮；斜線、虛線＝預測，確認後變實心"><svg class="ic"><use href="#i-info"/></svg></button>
      </div>

      <div class="editor">
        <section class="tl" id="tl">
          <div class="tl-lab ruler"><span class="mono" id="zoomLab" style="font-size:11px"></span></div>
          <div class="tl-track ruler" id="ruler"></div>
          <div class="tl-lab"><svg class="ic"><use href="#i-layers"/></svg>段落</div>
          <div class="tl-track t-sec" id="trSec"></div>
          <div class="tl-lab"><svg class="ic"><use href="#i-grid"/></svg>拍點</div>
          <div class="tl-track t-beat" id="trBeat"></div>
          <div class="tl-lab"><svg class="ic"><use href="#i-text"/></svg>歌詞</div>
          <div class="tl-track t-lyr" id="trLyr"></div>
          <div class="tl-lab"><svg class="ic"><use href="#i-wave"/></svg>人聲</div>
          <div class="tl-track t-wave"><canvas id="wave"></canvas></div>
          <div class="tl-lab"><svg class="ic"><use href="#i-hand"/></svg>應援</div>
          <div class="tl-track t-act" id="trAct"></div>
          <div class="tl-lab" style="border-bottom:0"><svg class="ic"><use href="#i-map"/></svg>全曲</div>
          <div class="tl-track t-ov" id="trOv" title="點一下跳到那裡"></div>
          <div class="playhead" id="playhead"></div>
        </section>
        <section class="table-wrap" id="tableView" hidden></section>
      </div>
    </main>

    <!-- 右側：檢查器 —— 句子／歌曲／情報 -->
    <aside class="peek">
      <div class="peek-bar" id="peekTabs">
        <button class="tab on" data-tab="line">句子</button>
        <button class="tab" data-tab="song">歌曲</button>
        <button class="tab" data-tab="intel">情報 <span class="n">1</span></button>
      </div>
      <div class="peek-body" id="insp"></div>
    </aside>
  </div>

  <script src="../../../songs.js"></script>
  <script src="../../../song-lyrics.js"></script>
  <script src="studio.js"></script>
</body>
</html>
