# 推到 main 就建置（每首歌一頁、網站地圖）並發布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check data
        run: node scripts/check-data.mjs
      - name: Test karaoke
        run: node scripts/test-karaoke.mjs
      # 英文版歌詞下面的羅馬拼音：裝 kuromoji（日文斷詞）產生 song-romaji.json；失敗的話照常建置，只是英文版不放羅馬拼音
      - name: Romaji
        continue-on-error: true
        run: npm install --no-save --no-package-lock kuromoji@0.1.2 && node tools/romaji/romaji.mjs
      - name: Build
        run: node scripts/build.mjs dist
      # 畫面冒煙測試：開建置好的網站走一遍首頁、歌曲頁、分享、測驗模式、離線；沒過就不發布
      - name: UI test
        run: npm install --no-save --no-package-lock playwright@1.64.1 && npx playwright install --with-deps chromium-headless-shell && node scripts/test-ui.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
